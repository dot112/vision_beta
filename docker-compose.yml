# Production deployment of the vision server.
#
#   cp .env.example .env      # then set SECRET_KEY and ADMIN_INITIAL_PASSWORD
#   docker compose up -d --build
#
# Recovery:
#   - restart: unless-stopped brings the container back after a crash, after
#     the health watchdog stops a hung server (docker/supervise.py), after the
#     kernel's OOM killer ends it at mem_limit, and after a host reboot, as long
#     as the Docker service starts on boot (`sudo systemctl enable docker`).
#     A container stopped with `docker compose stop` stays stopped until started
#     again. Docker waits longer between restarts while a container keeps
#     failing within 10 s of starting (100 ms, doubling up to 1 minute).
# Data:
#   - the database, saved settings, models, uploads, MQTT certificates and logs
#     are named volumes, kept across restarts, rebuilds and `docker compose down`
#     (only `docker compose down -v` deletes them). Everything else in the
#     container is read-only or temporary.
# Shutdown:
#   - SIGTERM, then up to stop_grace_period for open requests to finish,
#     queued PLC operations to complete and PLC outputs to reach their safe state.

name: vision-server

services:
  vision:
    build:
      context: .
    image: fastapi-vision-server:2.0.0
    restart: unless-stopped
    # tini as PID 1: reaps zombie processes and passes signals to the supervisor.
    init: true

    env_file:
      - path: .env
        required: true
    environment:
      # Fixed for the container: these paths are on the volumes below.
      APP_ENV: production
      DEBUG: "false"
      HOST: 0.0.0.0
      PORT: "8000"
      WORKERS: "1"
      DATABASE_URL: sqlite+aiosqlite:///./data/factory_data.db
      MODEL_STORE_PATH: ./model_store
      LOG_DIR: ./logs
      TZ: ${TZ:-UTC}
      GRACEFUL_SHUTDOWN_SECONDS: "20"

    # Only the HTTP API and dashboards. VISION_BIND_ADDRESS limits it to one
    # network card of the host (for example the plant network's address).
    ports:
      - "${VISION_BIND_ADDRESS:-0.0.0.0}:${VISION_HTTP_PORT:-8000}:8000"
    # The UDP discovery beacon (port 8888) answers with the address it sees,
    # which inside a bridge network is the container's own and useless to
    # clients. For discovery, and for PLCs or cameras that must see the host's
    # address, use the host network instead: remove `ports:` and uncomment
    # (the API is then on port PORT of every host interface):
    # network_mode: host

    volumes:
      - vision-data:/app/data
      - vision-models:/app/model_store
      - vision-uploads:/app/uploads
      - vision-certs:/app/certs
      - vision-logs:/app/logs

    # The code and libraries are read-only; only the volumes above and /tmp
    # can be written. Large uploads spill to uploads/.tmp (TMPDIR), not RAM.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

    # USB cameras and Modbus RTU serial adapters must be passed in explicitly.
    # Uncomment what the machine has; a device listed here that does not exist
    # stops the container from starting.
    # devices:
    #   - /dev/video0:/dev/video0
    #   - /dev/ttyUSB0:/dev/ttyUSB0
    # group_add:
    #   - video      # or the numeric gid of /dev/video0 on the host
    #   - dialout    # or the numeric gid of /dev/ttyUSB0

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s

    stop_signal: SIGTERM
    # uvicorn's 20 s grace for open requests plus up to 30 s for the PLC
    # safe-state shutdown (docker/supervise.py), with room to spare.
    stop_grace_period: 60s

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # Upper bounds that stop a leak or runaway from taking the whole machine
    # down; inference is not throttled. Past mem_limit the server is killed
    # and restarted. Set VISION_MEM_LIMIT to about 3/4 of the machine's RAM.
    # To cap CPU as well, add for example: cpus: "3.5"
    mem_limit: ${VISION_MEM_LIMIT:-4g}
    pids_limit: 1024

    # Bounded logs so a noisy camera or PLC cannot fill the disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  vision-data:
  vision-models:
  vision-uploads:
  vision-certs:
  vision-logs:
