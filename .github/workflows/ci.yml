name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.16.9"
      - run: ruff check --output-format=github .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write a throwaway .env
        run: |
          cp .env.example .env
          sed -i "s/^SECRET_KEY=.*/SECRET_KEY=ci-only-secret-key-$(openssl rand -hex 16)/" .env
          sed -i "s/^ADMIN_INITIAL_PASSWORD=.*/ADMIN_INITIAL_PASSWORD=ci-only-admin-$(openssl rand -hex 12)/" .env
      - name: Build and start with Docker Compose on a fresh database
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Server is healthy and rejects unauthenticated requests
        run: |
          curl -fsS http://127.0.0.1:8000/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/rules)" = 401
      - name: Container runs as an unprivileged user and holds no .env
        run: |
          test "$(docker compose exec -T vision id -u)" != 0
          docker compose exec -T vision test ! -e /app/.env
      - name: Stops cleanly
        run: |
          docker compose stop
          test "$(docker inspect -f '{{.State.ExitCode}}' "$(docker compose ps -aq vision)")" = 0
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Clean up
        if: always()
        run: docker compose down -v
