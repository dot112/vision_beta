# The broker of the optional `mqtt` service in docker-compose.yml:
#   docker compose --profile broker up -d
#
# One listener on the plant network, a login for every client, and its
# retained messages and sessions kept on the `vision-broker` volume.
# The login is BROKER_USERNAME / BROKER_PASSWORD from .env (start.sh writes
# the password file from them on every start).

listener 1883
allow_anonymous false
password_file /mosquitto/data/passwd

persistence true
persistence_location /mosquitto/data/

log_dest stdout
