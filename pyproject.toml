[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
extend-exclude = ["test codes"]

[tool.ruff.lint]
# Start with the checks that catch code which crashes at runtime: syntax
# errors, undefined names and broken comparisons. Widen this once the
# existing unused-import warnings are cleaned up.
select = ["E9", "F63", "F7", "F82"]
